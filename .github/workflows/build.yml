name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git hash in versionNameSuffix

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDevelopmentDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lepsi-rozvrh-apk
          path: app/build/outputs/apk/development/debug/*.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/development/debug/*.apk
          generate_release_notes: true
